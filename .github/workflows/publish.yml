name: Publish
# Stages the version on npm when a version tag is pushed: git tag v1.7.0 && git push origin v1.7.0
# Auth: npm Trusted Publisher (OIDC) for this repository and publish.yml, no token stored. The trusted publisher only
# allows npm stage publish: the version waits staged until a maintainer approves it with 2FA (npm stage list /
# npm stage approve <id>, or on npmjs.com).
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
  # OIDC for the npm Trusted Publisher (and provenance, which links the package to this workflow run)
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json version
        run: |
          versao="v$(node -p "require('./package.json').version")"
          if [ "$versao" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json ($versao)"
            exit 1
          fi
      # npm stage needs a recent npm CLI
      - run: npm install -g npm@12
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm stage publish --access public --provenance
